services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: miamzy
      POSTGRES_PASSWORD: ${DB_PASSWORD:-miamzy_dev}
      POSTGRES_DB: miamzy
    ports: ["5434:5432"]
    volumes: ["pgdata:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U miamzy"]
      interval: 3s
      retries: 10
volumes:
  pgdata:
